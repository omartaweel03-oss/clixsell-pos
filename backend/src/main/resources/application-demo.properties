# ─────────────────────────────────────────────────────────────
# "demo" profile: for presentations and testing only.
# Start with:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=demo"
#
# On a NEW database (no stores yet) adds two demo stores (Shini – Ramallah,
# Neshan – Nablus) with staff, 10 products each, sales and a return.
# Logins: shini.admin / Admin-Pass-1, shini.cashier / Cashier-Pass-1,
#         shini.cashier2 / Cashier-Pass-1,
#         neshan.admin / Admin-Pass-1, neshan.cashier / Cashier-Pass-1
# A database that already has stores is left exactly as it is.
# ─────────────────────────────────────────────────────────────
clixsell.demo-data=true

# Demo / presentation / automated tests ONLY, on a throwaway database: the publicly documented demo
# System Admin password is allowed here (never in the normal configuration), and a new demo
# database may be created.
clixsell.system-admin.password=${CLIXSELL_ADMIN_PASSWORD:Admin12345}
clixsell.system-admin.allow-demo-password=true
clixsell.db.create-if-missing=${CLIXSELL_DB_CREATE:true}
