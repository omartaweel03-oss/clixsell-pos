# ─────────────────────────────────────────────────────────────
# ClixSell POS backend configuration
# ─────────────────────────────────────────────────────────────
spring.application.name=clixsell-backend

# The API listens on http://localhost:8080/api/...
server.port=8080

# ── Database: SQLite (single file, nothing to install) ──────
# The file clixsell.db is created in the folder you start the backend from (backend/).
# foreign_keys=on makes SQLite enforce the products → suppliers link.
spring.datasource.url=jdbc:sqlite:clixsell.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows only one writer at a time, so use a single connection.
spring.datasource.hikari.maximum-pool-size=1

# ── Schema: versioned migrations in src/main/resources/db/migration (Flyway) ──
# A database created before Flyway was added is treated as version 1, so only
# newer migrations (V2 multi-store, ...) run on it. V2 backs up the file first.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Set to true to print every SQL statement (INSERT / UPDATE / DELETE) in the console.
spring.jpa.show-sql=false

# Product images are sent as base64 inside JSON; allow requests up to 10 MB.
server.tomcat.max-swallow-size=10MB

# ── Login ───────────────────────────────────────────────────
# How long a login stays valid (hours).
clixsell.auth.session-hours=12

# First System Admin, created on the first start only (when none exists).
# Default login: sysadmin / Admin12345  -> change it before real use.
# You can also set the environment variable CLIXSELL_ADMIN_PASSWORD
# (at least 8 characters). If the value is empty, a random password is
# generated and printed ONCE in the console.
clixsell.system-admin.username=sysadmin
clixsell.system-admin.password=${CLIXSELL_ADMIN_PASSWORD:Admin12345}

# ── POS ─────────────────────────────────────────────────────
# Products can be returned within this many days of the sale.
clixsell.returns.max-days=14
