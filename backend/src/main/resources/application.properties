# ─────────────────────────────────────────────────────────────
# ClixSell POS backend configuration
# ─────────────────────────────────────────────────────────────
spring.application.name=clixsell-backend

# The API listens on http://localhost:8080/api/...
server.port=8080

# ── Database: SQLite (single file, nothing to install) ──────
# The file clixsell.db is created in the folder you start the backend from (backend/).
# foreign_keys=on makes SQLite enforce the products → suppliers link.
# Database file: CLIXSELL_DB_PATH (full path recommended), else clixsell.db in the folder the
# backend starts in. The absolute path is logged at start. A missing database is NOT created
# unless CLIXSELL_DB_CREATE=true (first start of a new installation) - see DatabaseLocationGuard.
spring.datasource.url=jdbc:sqlite:${CLIXSELL_DB_PATH:clixsell.db}?foreign_keys=on
clixsell.db.create-if-missing=${CLIXSELL_DB_CREATE:false}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows only one writer at a time, so use a single connection.
spring.datasource.hikari.maximum-pool-size=1

# ── Schema: versioned migrations in src/main/resources/db/migration (Flyway) ──
# A database created before Flyway was added is treated as version 1, so only
# newer migrations (V2 multi-store, ...) run on it. V2 backs up the file first.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Set to true to print every SQL statement (INSERT / UPDATE / DELETE) in the console.
spring.jpa.show-sql=false

# Product images are sent as base64 inside JSON; allow requests up to 10 MB.
server.tomcat.max-swallow-size=10MB

# ── Login ───────────────────────────────────────────────────
# How long a login stays valid (hours).
clixsell.auth.session-hours=12

# First System Admin, created on the first start only (when none exists).
# Default login: sysadmin / Admin12345  -> change it before real use.
# You can also set the environment variable CLIXSELL_ADMIN_PASSWORD
# (at least 8 characters). If the value is empty, a random password is
# generated and printed ONCE in the console.
clixsell.system-admin.username=sysadmin
# Initial System Admin password: ONLY from CLIXSELL_ADMIN_PASSWORD, and only needed when no System
# Admin exists yet (first start). There is deliberately no default password.
clixsell.system-admin.password=${CLIXSELL_ADMIN_PASSWORD:}

# ── POS ─────────────────────────────────────────────────────
# Products can be returned within this many days of the sale.
clixsell.returns.max-days=14

# ── Demo data ───────────────────────────────────────────────
# OFF by default: a real store starts with an empty database.
# For a demo or for testing, start with the "demo" profile
# (see application-demo.properties):
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=demo"
# It only adds data to a NEW database (no stores yet); existing records
# are never changed or deleted.
clixsell.demo-data=false

# ── Backups (Settings → Backup, System Admin only) ──────────
# Folder for database backups, next to clixsell.db (backend/backups/ when the
# backend is started from backend/). Not in Git. Restoring is manual: see
# INVENTORY_MODULE.md ("Backup and restore").
clixsell.backup.dir=backups
