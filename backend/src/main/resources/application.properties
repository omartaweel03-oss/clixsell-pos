# ─────────────────────────────────────────────────────────────
# ClixSell POS backend configuration
# ─────────────────────────────────────────────────────────────
spring.application.name=clixsell-backend

# The API listens on http://localhost:8080/api/...
server.port=8080

# ── Database: SQLite (single file, nothing to install) ──────
# The file clixsell.db is created in the folder you start the backend from (backend/).
# foreign_keys=on makes SQLite enforce the products → suppliers link.
spring.datasource.url=jdbc:sqlite:clixsell.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows only one writer at a time, so use a single connection.
spring.datasource.hikari.maximum-pool-size=1

# ── Schema: created from schema.sql on every start (CREATE TABLE IF NOT EXISTS) ──
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Set to true to print every SQL statement (INSERT / UPDATE / DELETE) in the console.
spring.jpa.show-sql=false

# Product images are sent as base64 inside JSON; allow requests up to 10 MB.
server.tomcat.max-swallow-size=10MB
